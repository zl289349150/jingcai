<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>竞彩实时盘口</title>
<style>
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f6f7f9;margin:0;color:#111}
.wrap{max-width:1100px;margin:0 auto;padding:20px 14px}
header{background:linear-gradient(135deg,#1e3a8a,#1a56db);color:#fff;padding:24px 20px;border-radius:12px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:22px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border:1px solid #e5e7eb;padding:6px 7px;text-align:left}
th{background:#eef2ff}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600}
.g{background:#dcfce7;color:#15803d}.y{background:#fef9c3;color:#a16207}.r{background:#fee2e2;color:#b91c1c}
</style></head><body><div class="wrap">
<header><h1>⚽ 竞彩实时盘口</h1><p id="meta">加载中…</p><p>官方赔率、让球盘和市场变化；预测结论请查看“预测日报”页面</p></header>
<div id="content"></div>
<script>
// 竞彩实时端：与预测日报共用同一官方在售比赛池，突出官方赔率/让球盘变化。
fetch("predictions.json").then(function(r){return r.json();}).then(function(list){
  var mode=list[0]&&list[0].data_mode?list[0].data_mode:"未取得";
  document.getElementById("meta").textContent = "共 " + list.length + " 场 · " + mode + " · 官方赔率/让球实时视图";
  var byLg = {};
  list.forEach(function(m){ (byLg[m.league] = byLg[m.league] || []).push(m); });
  var html = "";
  Object.keys(byLg).forEach(function(lg){
    html += '<div class="card"><h2>' + lg + '</h2><table><tr><th>开赛（北京时间）</th><th>对阵</th><th>官方1X2赔率</th><th>去水市场概率</th><th>官方让球盘</th><th>初盘→最新/市场信心</th><th>模型方向</th><th>Edge</th><th>预期总进球</th><th>大小球</th><th>Top 3 比分</th><th>辅助参考</th><th>模型类型</th><th>模型置信度</th><th>操作/仓位</th></tr>';
    byLg[lg].forEach(function(m){
      var mv=m.market_view||{}, o=mv.odds?mv.odds.map(function(x){return Number(x).toFixed(2);}).join(" / "):"未取得";
      var mk=mv.market_prob?mv.market_prob.map(function(x){return (x*100).toFixed(1)+"%";}).join(" / "):"未取得";
      var h=mv.handicap?("让"+mv.handicap.line+"："+mv.handicap.home+" / "+mv.handicap.draw+" / "+mv.handicap.away):"未取得";
      var move=mv.odds_move&&mv.odds_move.text?mv.odds_move.text:(m.odds_move||"未取得");
      var dir=m.direction||"无明显方向";
      var edge=m.edge==null?"—":(Number(m.edge)*100).toFixed(1)+"%";
      var cls = m.action === "可介入" ? "g" : (String(m.action||"").indexOf("轻仓")>=0||String(m.action||"").indexOf("观察")>=0 ? "y" : "r");
      var conf=m.model_confidence||"未取得";
      var goals=m.expected_total_goals==null?"未取得":Number(m.expected_total_goals).toFixed(2);
      var size=m.size_tendency||"未取得";
      var scores=(m.top_scores||[]).join("、")||"未取得";
      var rec=m.assistant_recommendation||"未取得";
      var modelType=m.model_type||m.model_status||"未取得";
      html += '<tr><td>' + (m.kickoff_bjt||m.date) + '</td><td>' + m.home + ' vs ' + m.away + '</td><td>' + o + '</td><td>' + mk + '</td><td>' + h + '</td><td>' + move + '</td><td>' + dir + '</td><td>' + edge + '</td><td>' + goals + '</td><td>' + size + '</td><td>' + scores + '</td><td>' + rec + '</td><td>' + modelType + '</td><td>' + conf + '</td><td><span class="tag ' + cls + '">' + (m.action||"辅助参考") + '</span><br>' + (m.stake||"0.0%") + '</td></tr>';
    });
    html += '</table></div>';
  });
  document.getElementById("content").innerHTML = html;
}).catch(function(e){
  document.getElementById("content").innerHTML = '<div class="card">加载失败：' + e + '</div>';
});
</script>
</div></body></html>
